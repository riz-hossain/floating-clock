name: Build

# Two speeds, on purpose.
#
# Every push runs `check` alone: a minute on one runner that imports the whole
# app and compiles it. It catches the breakage that matters while the code is
# changing quickly, and it produces nothing.
#
# The installers are only built when somebody asks -- the Run workflow button,
# or a v* tag. Packaging four platforms takes about eight runner-minutes and
# publishing on every commit would bury the real releases, so it is deliberate
# rather than automatic.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the installers as a GitHub release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # The build and release jobs run when asked for, and on a version tag.
  BUILD_WHEN: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install what the app imports
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3
          python -m pip install --quiet --upgrade \
            pillow PySide6 python-dateutil keyring pychromecast
      - name: Stage the package
        # The checkout is called floating-clock and a hyphen is not a module
        # name, so the sources are staged the way both build scripts do it.
        run: |
          mkdir -p stage/floating_clock
          cp *.py stage/floating_clock/
          cp -R qt stage/floating_clock/qt
          cp -R data stage/floating_clock/data
      - name: Compile every module
        run: python -m compileall -q stage/floating_clock
      - name: Import everything a real start needs
        env:
          PYTHONPATH: stage
          QT_QPA_PLATFORM: offscreen
        run: python -c "import sys; from floating_clock.qt.main import main; sys.exit(main(['--check']))"
      - name: Masjid readers, offline
        # Pins down what testing against real masjids turned up: a vanity
        # domain that redirects, a plugin whose "iqama" is its start times,
        # a masjid that switched iqama off. No network, so it cannot flake.
        env:
          PYTHONPATH: stage
        run: python packaging/check-readers.py
      - name: Reading a masjid's own web page, offline
        # Every layout met on real masjid sites and every page that must be
        # refused -- a placeholder table, June's times in September, a week of
        # different days -- on made-up pages; the sun; the fetch on a made-up
        # network. Nothing to flake.
        env:
          PYTHONPATH: stage
        run: python packaging/check-scrape.py
      - name: Finding a masjid, offline
        # The map, merging sources, and offering a nearby masjid's times when
        # a masjid has none of its own -- labelled, never passed off as its own.
        env:
          PYTHONPATH: stage
        run: python packaging/check-discovery.py
      - name: The timeline of a check, offline
        # What the picker shows while a masjid is being read: the steps, the bar,
        # Stop, and where everything is drawn -- on a made-up clock, so a step that
        # takes half a minute takes none.
        env:
          PYTHONPATH: stage
        run: python packaging/check-timeline.py
      - name: That the reading code reports what it does
        # The timeline is only worth having if it shows what is really happening.
        # This drives the real page reader, the way a site is tried and the choice
        # of what to offer on made-up networks, and reads the timeline afterwards.
        env:
          PYTHONPATH: stage
        run: python packaging/check-steps.py
      - name: Masjids near me, and what the picker offers
        # Where this computer is (Windows' location service, else the internet
        # address), the masjids around that point, and what the picker's buttons say
        # at each moment, including that a masjid whose times were found is kept
        # with Done. No network, no PowerShell and no window.
        env:
          PYTHONPATH: stage
        run: python packaging/check-near-me.py
      - name: The bundled masjid directory, offline
        # The research behind data/masjids.json has websites that are another
        # masjid's, dead, or a news article; the clock would show those times as
        # this masjid's. This holds the file to the corrections made to it, and
        # to one website not standing for masjids in different places.
        env:
          PYTHONPATH: stage
        run: python packaging/check-directory.py
      - name: The adhan through this computer's own speakers
        # No smart speaker and no assistant needed -- travelling, most of all.
        # The DLL, the subprocess, which players exist and the network are all
        # parameters here, so this drives the real decisions (Windows' MCI, macOS's
        # afplay, whichever of paplay/ffplay/mpg123/cvlc Linux actually has) without
        # any of them being real.
        env:
          PYTHONPATH: stage
        run: python packaging/check-localaudio.py
      - name: Routines fire the right kind, once, for the right prayer
        # A trigger URL, a cast, or this computer's own speakers -- whichever
        # combination is switched on, at the right moment, and not twice.
        env:
          PYTHONPATH: stage
        run: python packaging/check-routines.py
      - name: A page whose times a script writes in
        # A real headless Chrome on a page served from this machine: the
        # browser driver, and that nothing is left running afterwards.
        env:
          PYTHONPATH: stage
          FLOATING_CLOCK_NO_SANDBOX: "1"
        run: python packaging/check-render.py
      - name: Worker threads reach the UI
        # QTimer.singleShot from a plain thread is silently never called, which
        # left every Mac and Linux clock with no prayer times. This runs the
        # event loop for real; nothing else here does.
        env:
          PYTHONPATH: stage
          QT_QPA_PLATFORM: offscreen
        run: python packaging/check-qt-threads.py
      - name: A slider needs a click before the wheel touches it
        # Left to QSlider's own wheelEvent, scrolling a settings page full of them
        # silently changes whichever one the pointer happens to be over instead of
        # scrolling past it.
        env:
          PYTHONPATH: stage
          QT_QPA_PLATFORM: offscreen
        run: python packaging/check-qt-slider.py
      - name: Stopping the adhan, on the tray menu
        # A tray balloon has no button of its own, so the menu's "Stop <prayer>'s adhan" --
        # offered only while one is due or playing -- is what actually reaches it on Mac and
        # Linux; the warning notification itself is informational.
        env:
          PYTHONPATH: stage
          QT_QPA_PLATFORM: offscreen
        run: python packaging/check-qt-adhan-warning.py

  macos:
    name: macOS (${{ matrix.label }})
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple silicon
            label: arm64
          # macos-13 retired in December 2025; macos-15-intel is the last
          # x86_64 image GitHub will offer, and it runs until August 2027.
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app and a disk image
        run: bash packaging/build-unix.sh --dmg
      - name: Check the bundle is complete
        # --check imports everything a real start needs and exits. A bundle
        # missing one lazily imported module looks perfectly fine until
        # someone opens the settings window, and by then the build that
        # shipped it is long gone. Offscreen, so the runner needs no display.
        run: QT_QPA_PLATFORM=offscreen ./packaging/dist/FloatingClock.app/Contents/MacOS/FloatingClock --check
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClock-macos-${{ matrix.label }}
          path: packaging/dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3
      - name: Build
        run: bash packaging/build-unix.sh --tgz
      - name: Check the bundle is complete
        run: QT_QPA_PLATFORM=offscreen ./packaging/dist/FloatingClock/FloatingClock --check
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClock-linux-x86_64
          path: packaging/dist/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: check
    if: needs.check.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the app and the installer
        # -File rather than the default dot-sourcing wrapper, so the script
        # can always work out its own folder.
        run: pwsh -NoProfile -File ./packaging/build.ps1
      - name: Check the bundle is complete
        shell: pwsh
        run: ./packaging/dist/FloatingClock/FloatingClock.exe --check
      - uses: actions/upload-artifact@v4
        with:
          name: FloatingClock-windows-setup
          path: packaging/dist/FloatingClock-Setup-*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [macos, linux, windows]
    # A tag always publishes. The Run workflow button publishes unless the
    # publish box was unticked, which is how to get installers to try without
    # putting them in front of everyone.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the installers
        id: collect
        shell: python
        run: |
          import io, os, pathlib, re, shutil

          # __init__.py is the one place a version is written; the installer
          # takes it from there too, so the two cannot drift apart.
          text = io.open("__init__.py", encoding="utf-8").read()
          found_version = re.search(r'__version__\s*=\s*"([^"]+)"', text)
          if not found_version:
              raise SystemExit("no __version__ in __init__.py")
          version = found_version.group(1)

          # Artifacts arrive one directory per job; the release wants them flat.
          out = pathlib.Path("out")
          out.mkdir(exist_ok=True)
          names = []
          for path in pathlib.Path("artifacts").rglob("*"):
              if path.suffix in (".dmg", ".exe") or path.name.endswith(".tar.gz"):
                  shutil.copy2(path, out / path.name)
                  names.append(path.name)
          if len(names) < 4:
              raise SystemExit("expected four installers, found %s" % sorted(names))
          print("Publishing v%s: %s" % (version, ", ".join(sorted(names))))
          with io.open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("version=%s\n" % version)
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          name: Floating Clock ${{ steps.collect.outputs.version }}
          files: out/*
          generate_release_notes: true
          make_latest: true
          body: |
            Built from `${{ github.sha }}` by GitHub Actions.

            Neither installer is signed yet, so the first launch needs one
            extra step:

            - **macOS** - right-click the app in Applications, choose **Open**,
              then **Open** again. Once only.
            - **Windows** - SmartScreen will warn; choose **More info** then
              **Run anyway**. Once only.
